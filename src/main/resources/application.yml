server:
  port: 8080
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: heat-routing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heat}
    username: ${DB_USER:heat}
    password: ${DB_PASSWORD:heat}
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
      file-size-threshold: 0
      location: ${HEAT_TEMP_DIR:/tmp/heat}/multipart

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

heat:
  crs:
    calc: EPSG:32637
  ingest:
    temp-dir: ${HEAT_TEMP_DIR:/tmp/heat}
    batch-size: 1000
    max-issue-samples: 500
    workers: 2
    # Таблица 2 docs/rules.md: типы, для которых заданы правила
    known-restriction-types:
      - oks
      - park
      - social_area
      - prohibited_site
      - water
      - railway
      - road
      - tram_tracks
      - gas_pipeline
      - power_cable
      - heat_network
